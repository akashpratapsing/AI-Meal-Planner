
<svg viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  
  <!-- "FitMeal" Text -->
  <g transform="translate(400, 110)">
    <text x="0" y="0" 
          font-family="'Brush Script MT', cursive, 'Comic Sans MS', sans-serif" 
          font-size="130" 
          font-weight="bold" 
          text-anchor="middle"
          fill="#000000"
          letter-spacing="-2">
      FitMeal
    </text>
  </g>
  
  <!-- Swoosh underline -->
  <path d="M 150 175 Q 400 200 650 175" 
